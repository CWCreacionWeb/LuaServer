# ============================================================
#  lua-server :: Apache + mod_fcgid (solo PHP, multi-version)
#  Incluido desde bin/apache/conf/httpd.conf
#  Requiere que httpd.conf defina:  Define LUAROOT "..."
#  Los vhosts se generan con:  .\lua.ps1 reload
# ============================================================

# --- Modulo FastCGI (bridge a php-cgi.exe) ---
LoadModule fcgid_module modules/mod_fcgid.so

# --- Logs centralizados ---
ErrorLog  "${LUAROOT}/logs/apache/error.log"
CustomLog "${LUAROOT}/logs/apache/access.log" combined

# --- Ajustes globales de mod_fcgid (pool de procesos PHP) ---
# Cada version de PHP = su propio pool aislado (clave = ruta de php-cgi.exe).
FcgidIPCDir               "${LUAROOT}/tmp"
FcgidProcessTableFile     "${LUAROOT}/tmp/fcgid_shm"
FcgidFixPathinfo          0
FcgidMaxRequestsPerProcess 500
FcgidIOTimeout            300
FcgidBusyTimeout          300
FcgidIdleTimeout          300
FcgidConnectTimeout       20
FcgidMinProcessesPerClass 1
FcgidMaxProcessesPerClass 12
FcgidMaxProcesses         200
FcgidMaxRequestLen        1073741824

<IfModule mod_fcgid.c>
    AddHandler fcgid-script .php
</IfModule>

# --- Seguridad base: todo denegado salvo lo que abran los vhosts ---
<Directory />
    AllowOverride None
    Require all denied
    Options None
</Directory>

# ============================================================
#  Sitio por defecto: panel (localhost)
# ============================================================
<VirtualHost *:80>
    ServerName localhost
    ServerAlias lua.test 127.0.0.1
    DocumentRoot "${LUAROOT}/tools/dashboard"
    FcgidInitialEnv PHPRC "${LUAROOT}/bin/php/8.4"

    <Directory "${LUAROOT}/tools/dashboard">
        Options +ExecCGI +FollowSymLinks
        AllowOverride All
        DirectoryIndex index.php index.html
        FcgidWrapper "${LUAROOT}/bin/php/8.4/php-cgi.exe" .php
        # Panel de gestion: solo desde esta maquina (localhost)
        <RequireAny>
            Require ip 127.0.0.1
            Require ip ::1
        </RequireAny>
    </Directory>
</VirtualHost>

# ============================================================
#  Vhosts de proyectos (generados por lua.ps1 desde sites.json)
# ============================================================
IncludeOptional "${LUAROOT}/config/apache/vhosts/*.conf"
