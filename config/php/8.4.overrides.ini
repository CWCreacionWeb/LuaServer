; Ajustes editables desde el panel (http://localhost). Se aplican al final: ganan.
date.timezone = Europe/Madrid
memory_limit = 512M
upload_max_filesize = 128M
post_max_size = 128M
max_execution_time = 120
max_input_vars = 5000
display_errors = Off
error_reporting = E_ALL

; El curl de este PHP esta enlazado con OpenSSL (no Schannel), asi que no
; consulta el almacen de certificados de Windows: sin esto, cualquier
; llamada HTTPS saliente (IA: Anthropic/OpenAI/Groq) falla con "cURL error
; 60: unable to get local issuer certificate". Bundle generado desde el
; almacen de certificados raiz de Windows (Cert:\LocalMachine\Root+CA+AuthRoot),
; sin depender de descargar nada de internet.
curl.cainfo = "C:\personal\LuaServer\config\php\cacert.pem"
openssl.cafile = "C:\personal\LuaServer\config\php\cacert.pem"
